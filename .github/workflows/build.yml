name: Build static website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build site
        run: npm run build
      - name: Validate expected output
        run: |
          test -s dist/index.html
          test -d dist/css
          test -d dist/js
